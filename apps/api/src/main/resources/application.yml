spring:
  application:
    name: ttp-api
  datasource:
    # H2 is temporary for the mock vertical slice only. Do not use this setting
    # for production or real evaluation data.
    url: jdbc:h2:mem:ttp_mock;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true # Local development only.
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: never

server:
  port: 8080

ttp:
  cors:
    allowed-origins:
      - http://localhost:3000
